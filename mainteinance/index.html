<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSL Realty | Under Maintenance</title>
<meta name="description" content="WSL Realty is getting a refresh. We will be back in a few days.">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root { --bg:#F8E8CF; --navy:#0B2B44; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--navy);
    font-family:Georgia, "Times New Roman", serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  main { width:100%; max-width:640px; }
  .logo { width:min(340px, 70vw); height:auto; display:block; margin:0 auto 8px; }
  .rule { width:64px; height:3px; background:var(--navy); margin:20px auto 28px; border-radius:2px; }
  h1 {
    font-size:clamp(1.6rem, 5vw, 2.4rem); font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; margin-bottom:16px;
  }
  p { font-size:clamp(1rem, 2.6vw, 1.2rem); line-height:1.7; max-width:520px; margin:0 auto 12px; }
  .note { margin-top:28px; font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="WSL Realty - Waro Synergy Limited">
    <div class="rule"></div>
    <h1>Website Under Maintenance</h1>
    <p>We are giving our website a fresh new look and more features.</p>
    <p>We will be back up in a few days. Thank you for your patience.</p>
    <p class="note">Waro Synergy Limited</p>
  </main>
</body>
</html>
